name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest tests/ -v

  devagent-typecheck:
    name: DevAgent TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
        working-directory: devagent
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: devagent

  mcp-tools-typecheck:
    name: dangerous-tools MCP server typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
        working-directory: devagent/mcp-tools
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: devagent/mcp-tools
