[project]
name = "forgeguard"
version = "0.1.0"
description = "Trajectory-based security and reliability tester for AI agents built on TrueForge"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "click>=8.1",
]

[project.scripts]
forgeguard = "forgeguard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeguard"]
